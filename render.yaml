services:
  - type: web
    name: content-affiliate-hub
    runtime: docker
    healthCheckPath: /affiliate-login
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_discounts,read_metaobjects,read_orders,read_products,write_app_proxy,write_discounts,write_metaobjects,write_products
      - key: RESEND_API_KEY
        sync: false
      - key: AFFILIATE_EMAIL_FROM
        sync: false
